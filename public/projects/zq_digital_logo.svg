<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#14100F" />
      <stop offset="60%" stop-color="#0A0908" />
      <stop offset="100%" stop-color="#050504" />
    </radialGradient>

    <!-- Silver Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Metallic Silver Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E4E9" />
      <stop offset="100%" stop-color="#9A9490" />
    </linearGradient>

    <!-- Slate Silver Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E4E9" />
      <stop offset="100%" stop-color="#4A4340" />
    </linearGradient>

    <!-- Soft Ambient Glow -->
    <radialGradient id="cyanAmbient" cx="50%" cy="40%" r="35%">
      <stop offset="0%" stop-color="rgba(226, 228, 233, 0.15)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGlow)" />
  <circle cx="400" cy="240" r="220" fill="url(#cyanAmbient)" />

  <!-- Grid Guide Lines (Subtle Vector Aesthetic) -->
  <g opacity="0.08" stroke="#E2E4E9" stroke-width="1" stroke-dasharray="4 4">
    <line x1="200" y1="240" x2="600" y2="240" />
    <line x1="400" y1="80" x2="400" y2="400" />
    <circle cx="400" cy="240" r="140" fill="none" />
  </g>

  <!-- LOGO EMBLEM: Interlocking Z & Q Monogram -->
  <g transform="translate(400, 230)">
    <!-- Outer Q Loop Glow -->
    <path d="M -60 -40 L 60 -40 L -40 60 L 60 60 C 85 60 100 35 100 0 C 100 -55 60 -95 0 -95 C -60 -95 -100 -55 -100 0 C -100 55 -60 95 0 95 C 45 95 80 70 95 30" 
          fill="none" 
          stroke="#E2E4E9" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#neonGlow)"
          opacity="0.85" />

    <!-- Main Metallic Z Path -->
    <path d="M -70 -50 L 50 -50 L -50 50 L 70 50" 
          fill="none" 
          stroke="url(#silverGrad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Q Tail Accents (Vector Pen Tool Anchor Points) -->
    <path d="M 25 25 L 75 75" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="16" 
          stroke-linecap="round" 
          filter="url(#neonGlow)" />

    <!-- Anchor Point Nodes -->
    <circle cx="-70" cy="-50" r="6" fill="#0A0908" stroke="#E2E4E9" stroke-width="3" />
    <circle cx="70" cy="50" r="6" fill="#0A0908" stroke="#E2E4E9" stroke-width="3" />
    <rect x="70" y="70" width="10" height="10" fill="#E2E4E9" transform="translate(-5, -5)" />
  </g>

  <!-- LOGO TYPOGRAPHY -->
  <g text-anchor="middle">
    <!-- Primary Brand Title -->
    <text x="400" y="420" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="52" letter-spacing="6" fill="url(#silverGrad)">
      ZQ <tspan fill="#E2E4E9">DIGITAL</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="400" y="460" font-family="'Inter', sans-serif" font-weight="500" font-size="14" letter-spacing="10" fill="#9A9490" opacity="0.9">
      BRAND IDENTITY &amp; VECTOR STUDIO
    </text>
  </g>
</svg>
